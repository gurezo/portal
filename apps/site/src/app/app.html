<main
  class="min-h-screen bg-slate-50 text-slate-950 selection:bg-sky-200 selection:text-slate-950"
>
  <div
    class="pointer-events-none fixed inset-0 -z-10 bg-[radial-gradient(circle_at_top_left,rgba(14,165,233,0.12),transparent_36rem),linear-gradient(180deg,#ffffff_0%,#f8fafc_100%)]"
    aria-hidden="true"
  ></div>

  <div
    class="mx-auto flex min-h-screen w-full max-w-screen-2xl flex-col px-6 py-8 sm:px-8 lg:px-12 lg:py-10"
  >
    <header class="mb-8 flex items-center justify-between">
      <a
        href="/"
        class="rounded-sm font-bold text-slate-900 transition hover:text-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-400 focus:ring-offset-2"
        aria-label="gurezo.net home"
      >
        <span class="text-lg tracking-tight">gurezo.net</span>
      </a>

      <nav class="flex items-center gap-6" aria-label="Main navigation">
        <a
          href="#projects-heading"
          class="rounded-sm font-bold text-slate-700 underline-offset-4 hover:text-sky-700 hover:underline focus:outline-none focus:ring-2 focus:ring-sky-400 focus:ring-offset-2"
        >
          Projects
        </a>

        <a
          href="https://github.com/gurezo"
          target="_blank"
          rel="noopener noreferrer"
          class="rounded-sm font-bold text-slate-700 underline-offset-4 hover:text-sky-700 hover:underline focus:outline-none focus:ring-2 focus:ring-sky-400 focus:ring-offset-2"
          aria-label="GitHub (opens in a new tab)"
        >
          GitHub
        </a>
      </nav>
    </header>

    <router-outlet />

    <footer
      class="mt-4 flex flex-col gap-4 border-t border-slate-200 py-6 text-sm text-slate-500 sm:mt-6 sm:flex-row sm:items-center sm:justify-between"
    >
      <p class="m-0 flex flex-wrap gap-2">
        <span class="font-semibold text-slate-700">gurezo.net</span>
        <span aria-hidden="true">·</span>
        <span>OSS resources by gurezo</span>
      </p>

      <nav class="flex flex-wrap gap-5" aria-label="Footer links">
        <a
          href="https://lifewood.net/"
          class="rounded-sm font-bold text-sky-700 underline-offset-4 hover:underline focus:outline-none focus:ring-2 focus:ring-sky-400 focus:ring-offset-2"
        >
          lifewood.net
        </a>

        <a
          href="https://github.com/gurezo"
          class="rounded-sm font-bold text-sky-700 underline-offset-4 hover:underline focus:outline-none focus:ring-2 focus:ring-sky-400 focus:ring-offset-2"
        >
          GitHub
        </a>
      </nav>
    </footer>
  </div>
</main>
