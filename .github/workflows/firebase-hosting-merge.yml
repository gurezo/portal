name: Deploy portal to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout portal
        uses: actions/checkout@v4

      - name: Checkout web-serial-rxjs
        uses: actions/checkout@v4
        with:
          repository: gurezo/web-serial-rxjs
          path: tmp/web-serial-rxjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install portal dependencies
        run: npm ci

      - name: Build portal site into firebase-public
        run: npm run build:firebase:site

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js for web-serial-rxjs
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tmp/web-serial-rxjs/pnpm-lock.yaml

      - name: Build and import web-serial-rxjs static fragment
        working-directory: tmp/web-serial-rxjs
        run: |
          pnpm install --frozen-lockfile
          pnpm run docs
          test -f dist/portal/web-serial-rxjs/index.html
          rm -rf "${GITHUB_WORKSPACE}/firebase-public/web-serial-rxjs"
          cp -a dist/portal/web-serial-rxjs "${GITHUB_WORKSPACE}/firebase-public/web-serial-rxjs"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GUREZO_PORTAL }}
          projectId: gurezo-portal
          target: gurezo-portal
          channelId: live
