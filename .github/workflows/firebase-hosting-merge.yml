name: Deploy portal to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require cross-repo artifact token
        env:
          CROSS_REPO_ACTIONS_TOKEN: ${{ secrets.CROSS_REPO_ACTIONS_TOKEN }}
        run: |
          if [ -z "${CROSS_REPO_ACTIONS_TOKEN}" ]; then
            echo "error: repository secret CROSS_REPO_ACTIONS_TOKEN is required" >&2
            echo "Create a PAT with actions:read on gurezo/web-serial-rxjs and add it as CROSS_REPO_ACTIONS_TOKEN." >&2
            exit 1
          fi

      - name: Build Firebase public directory
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_ACTIONS_TOKEN }}
        run: npm run build:firebase

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GUREZO_PORTAL }}
          projectId: gurezo-portal
          target: gurezo-portal
          channelId: live
