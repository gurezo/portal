packages:
  - 'apps/*'
  - 'libs/*'
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  protobufjs: true
  re2: true

# 悪意のあるリリースは1週間以内に発見され、レジストリから削除される為
# config = 7 day x 24h x 60 min
minimumReleaseAge: 10080
# レビュー済み lockfile の frozen install では公開日チェックを再適用しない
# 新規解決（pnpm add / update）では minimumReleaseAge が効く
trustLockfile: true
